<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kryptix — Gemini Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="chat-app">
    <header class="chat-header">
      <div class="title">
        <span class="dot" id="statusDot"></span>
        <h1>Kryptix</h1>
      </div>
      <div class="sub">
        <span id="modelLabel">Gemini · context-managed</span>
        <button id="resetBtn" type="button" title="Start a new conversation">New chat</button>
      </div>
    </header>

    <section id="messages" class="chat-messages" aria-live="polite"></section>

    <div id="contextBar" class="context-bar" hidden>
      turn <b id="cbTurn">1</b> · window <b id="cbWindow">0</b>/<b id="cbTotal">0</b> msgs ·
      summary <b id="cbSummary">inactive</b>
    </div>

    <form id="chatForm" class="chat-input">
      <input id="msgInput" type="text" autocomplete="off" maxlength="4000"
             placeholder="Ask me anything — I'll remember what you said earlier…" />
      <button id="sendBtn" type="submit">Send</button>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
